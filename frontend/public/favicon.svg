<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <radialGradient id="wl-fav-lens" cx="38%" cy="36%" r="62%">
      <stop offset="0%" stopColor="#1E2530" />
      <stop offset="45%" stopColor="#0E1218" />
      <stop offset="85%" stopColor="#05070A" />
      <stop offset="100%" stopColor="#000000" />
    </radialGradient>
    <linearGradient id="wl-fav-front" x1="8" y1="36" x2="42" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FF946C" />
      <stop offset="35%" stopColor="#FF6B35" />
      <stop offset="70%" stopColor="#D94F20" />
      <stop offset="100%" stopColor="#F3F0E8" />
    </linearGradient>
    <linearGradient id="wl-fav-back" x1="10" y1="20" x2="38" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#8C2C08" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#D94F20" stopOpacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Background Base for High Contrast on any browser theme -->
  <rect width="48" height="48" rx="10" fill="#080A0E" />

  <!-- 1. Corner Scan Brackets -->
  <path d="M6 14V9C6 7.34 7.34 6 9 6H14" stroke="#FF6B35" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="14" cy="6" r="1.2" fill="#FF804F" />
  <path d="M42 34V39C42 40.66 40.66 42 39 42H34" stroke="#FF6B35" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="34" cy="42" r="1.2" fill="#FF804F" />

  <!-- 2. Back Half of 3D Orbital Ring -->
  <path d="M10.5 28C10 23.5 16 16.5 28 16.5C36.5 16.5 40 20 40 23" stroke="url(#wl-fav-back)" stroke-width="3.5" stroke-linecap="round" />

  <!-- 3. Outer Lens Core -->
  <circle cx="24" cy="24" r="12" fill="url(#wl-fav-lens)" stroke="#FF6B35" stroke-width="1.2" />
  <circle cx="24" cy="24" r="8.5" fill="#080A0E" stroke="#232B36" stroke-width="0.8" />

  <!-- 4. Front Half of 3D Orbital Scan Ring -->
  <path d="M7 29C9.5 35.5 18 37 28.5 34.5C35.5 32.5 41 28 42 23.5" stroke="url(#wl-fav-front)" stroke-width="3.8" stroke-linecap="round" />
  <path d="M9 29.2C11.5 34.8 19 36.2 28 34C34 32.2 39.5 28.2 40.8 24.5" stroke="#F3F0E8" stroke-width="1.1" stroke-linecap="round" opacity="0.75" />

  <!-- 5. Specular Reflection Dot -->
  <circle cx="21" cy="20.5" r="2.2" fill="#F3F0E8" />
  <circle cx="25.5" cy="26" r="1" fill="#F3F0E8" opacity="0.6" />

  <!-- 6. Active Focus Node -->
  <circle cx="9" cy="29" r="2" fill="#FF804F" />
  <circle cx="9" cy="29" r="0.8" fill="#FFFFFF" />
</svg>
