<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebLens</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      padding: 16px;
      background-color: #090D16;
      color: #F1F5F9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .logo-badge {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2563EB, #3B82F6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
      color: white;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .subtitle {
      font-size: 10px;
      color: #64748B;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .url-card {
      background: #0F172A;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 14px;
      word-break: break-all;
      font-size: 11px;
      color: #94A3B8;
      font-family: monospace;
    }
    .btn {
      width: 100%;
      background: #2563EB;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1D4ED8;
    }
    .btn:disabled {
      background: #334155;
      cursor: not-allowed;
    }
    .footer {
      margin-top: 12px;
      text-align: center;
      font-size: 10px;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">W</div>
    <div>
      <div class="title">WebLens</div>
      <div class="subtitle">Instant Website Audit</div>
    </div>
  </div>

  <div id="url-box" class="url-card">
    Detecting active tab...
  </div>

  <button id="analyze-btn" class="btn" disabled>
    <span>⚡ Analyze with WebLens</span>
  </button>

  <div class="footer">
    Core Web Vitals • SEO • A11y • Security
  </div>

  <script src="popup.js"></script>
</body>
</html>
